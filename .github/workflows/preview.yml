# Preview for review (plan § 3, ADR 0003). Runs rig, saves /digest/<night> as one HTML file and
# deploys it to GitHub Pages. The file is never committed. The marker comes from the
# LANE_MARKER secret; delete the secret and run again to take it off (plan § 4).
name: preview

on:
  workflow_dispatch:
    inputs:
      night:
        description: Night to preview
        default: '2026-10-28'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save the page
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
          NIGHT: ${{ inputs.night }}
          PORT: 8787
        run: |
          pnpm start &
          for i in $(seq 1 30); do curl -sf localhost:8787/health >/dev/null && break; sleep 1; done
          mkdir -p _site
          curl -sf "localhost:8787/digest/$NIGHT" -o _site/index.html
          grep -q '<table' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
